# TAL PROFILE: plays as close to Mikhail Tal as we can measure. Maia-3 Lichess bot settings. Edit on github.com; most changes apply within ~30 s, even mid-session.

maia:
  model: maia3-79m     # (model change needs a restart)
  checkpoint: tal-79m.pt   # Maia-3 79M fine-tuned on Tal's games (downloaded at start)
  elo: 2600            # rating Maia imitates (trained range 600-2600)
  temperature: 0.40    # lower = more consistent. 0.4 is a strong human, not a robot
  top_p: 1.0           # only sample from the most likely moves covering this probability
  oppo_elo: 2600       # opponent rating Maia assumes; "opponent" = real rating (plays sloppier vs weak players)

search:                # light human-like calculation with Maia's own judgement (no Stockfish)
  enabled: true
  candidates: 4        # natural moves considered (Maia's most likely)
  depth: 1             # 1 = check the opponent's likely replies; 2 = also our answer (slower)
  widths: [3, 2]       # replies considered at each level
  margin: 0.10         # moves within 10% expected score of the best line stay eligible
  skip_if_prob: 0.9    # don't calculate when one move is obvious
  min_clock_seconds: 30

mcts:                  # real calculation, Leela-style, with Maia only (no Stockfish), kept human
  enabled: true
  max_seconds: 3       # thinking budget on normal moves (part of the human move time, not extra)
  hard_seconds: 7      # budget on hard moves (Maia unsure: top move under 35%)
  hard_below: 0.35
  max_clock_share: 0.04  # never more than 4% of the remaining clock on one move
  max_nodes: 400       # positions looked at, at most
  width: 6             # candidate moves per position (only natural, human moves)
  root_width: 10
  batch: 8             # positions evaluated per network call (faster on CPU)
  fpu_reduction: 0.1
  max_depth: 6         # calculation horizon in plies (3 moves each), like a strong human
  cpuct: 1.5
  sharpness: 0.5       # opponent assumed to answer like a strong human
  margin: 0.15         # keep the natural (style) move unless the calculation shows a clear mistake (15% expected score)
  min_prior: 0.04      # only moves Maia gives 4%+ (or its top 3) can be played: no engine-only moves
  min_visits: 3
  skip_if_prob: 0.85   # don't calculate obvious moves
  min_clock_seconds: 45

style:                 # consistent playing style (one "person" across games)
  enabled: true
  name: tal_learned  # Tal-style rules with weights fitted on Tal's games
  rules_file: tal/tal-rules.json
  strength: 2.0        # 0 = pure Maia, 1 = noticeable, 2+ = very consistent / predictable
  candidates: 12       # Maia's moves the Tal rules choose between
  min_relative_prob: 0.25 # rules may pick moves at least a quarter as likely as Maia's top choice
  plans:               # classic theory between natural moves: free the worst piece, pawn breaks, go for the king
    enabled: true
    strength: 1.2      # a nudge toward the king, not a reason to pick a bad break
    min_relative_prob: 0.25  # only moves at least a quarter as likely as Maia's top choice

timing:                # human-like thinking time, based only on the move (not on the clock)
  enabled: true
  speed: 1.0           # multiplies all times: 1.5 = slower, 0.7 = faster
  reference_game_seconds: 180  # v8 (from Magnus v1): times below are for 3+0; longer games scale up (15+10 is ~3x slower)
  clock_scale_power: 0.8
  top_factor: 0.85     # v8 (measured on Carlsen's games): instinct moves come faster...
  surprise_factor: 1.8 # ...unexpected moves (e.g. sacrifices) after about twice as long
  book: [0.2, 0.8]     # seconds (min, max) for prepared opening moves
  forced: [0.1, 0.5]   # only one legal move, or one move Maia is 95%+ sure about
  obvious: [0.2, 1.0]  # recaptures and moves Maia is 80%+ sure about
  follow_up: [0.3, 1.2]  # moving the same piece again right after moving it
  normal: [1.0, 4.0]
  hard_quick: [0.8, 2.5]   # hard moves are inconsistent: sometimes decided quickly...
  hard: [3.0, 9.0]         # ...usually a few seconds...
  long_think: [10.0, 25.0] # ...sometimes a long think
  hard_quick_chance: 0.35
  long_think_chance: 0.2
  # safety net: under 30 s on the clock it plays fast so it never loses on time

assist:                # quality filter: only between Maia's own natural candidate moves
  enabled: false         # stops clearly worse choices when a natural alternative is much better
  only_when_not_top: false # also checks Maia's own first choice (with more freedom, below)
  max_loss_cp: 200     # only replace moves that are 2+ pawns worse than a natural alternative (real blunders)
  top_max_loss_cp: 300 # Maia's own first choice: only if 3+ pawns worse
  min_prob: 0.02       # candidates Maia gives at least 2% are considered (finds more sacrifices)
  depth: 12            # the replacement is picked at random among the OK candidates, weighted by Maia
  brilliant_chance: 0.85   # if a natural candidate sacrifices material and Stockfish rates it (nearly) best, play it this often
  brilliant_margin_cp: 40  # "nearly best" = at most 0.4 pawns below the best natural candidate

search_filter:         # v8 (from Magnus v1): Maia's own feel drops candidates that lose quickly, before the Tal rules choose
  enabled: true        # measured on Tal's games: Tal's real move 47.2% vs 46.5% without, sacrifices kept (6.1% vs 5.0%)
  margin: 0.08         # drop moves that lose quickly; sacrifices still stay in
  keep_sacrifices: true  # sacrifices always stay eligible (Tal show)
  min_clock_seconds: 30

tal_rules2:            # rules fitted on 46,000 Tal positions: Tal model + Stockfish's verdict on its natural moves
  enabled: true        # (Tal was much more accurate than the model: 17 vs 29 cp average loss)
  file: tal/tal-rules2.json
  candidates: 10       # only Maia's 10 most natural moves are considered (stays human)
  temperature: 0.65    # tighter than the measured 1.1: still varies, but like a world champion not a club attacker
  tal_traits_boost: 2.0  # attack and sacrifices still count double, they no longer override a clear loss
  depth: 14
  stockfish_weight: 0.55  # Tal's own games lost ~17cp; the raw model loses ~29. Weight accuracy back up.
  lapse_chance: 0.05   # rare inattention, not a blunder every few moves
  human_curve:         # measured on 250 games of 2300-2600 players (Lichess Elite Database)
    enabled: true
    start_move: 20     # from move 20 on, instinct moves get more frequent (humans tire / positions get harder)
    per_move: 0.003
    sharp_extra: 0.02
    ahead_cp: 300
    ahead_extra: 0.05
    ahead_stockfish_factor: 0.75
    late_start: 40
    late_extra: 0.03
    late_stockfish_factor: 0.8
    max_lapse: 0.18
    lapse_mode: tal    # "human errors" keep Tal's style: same Tal preferences, only Stockfish's precision is dropped
    lapse_stockfish_factor: 0.0
  min_clock_seconds: 60  # under 1 minute left: plays on instinct only (more time-pressure mistakes)
  complicate_when_worse:   # Tal's practical chances: when worse, make it messy instead of defending passively
    enabled: true
    below_cp: -40        # only stir it up when actually worse, not while equal or winning
    stockfish_factor: 0.8
    max_extra_loss_cp: 70  # a mess is allowed, a pawn-and-a-half gift is not
    bonus:
      complexity: 0.6
      threat: 0.5
      forcing: 0.4
      sacrifice: 0.7
      even_trade: -0.8
      queen_trade: -1.4

brilliant:             # Tal mode: always go for sacrifices that keep the position at least equal
  enabled: true
  chance: 0.55         # real Tal took 43% of sound sacrifices; always was a show, not his strength
  min_eval_cp: -30
  min_prob: 0.02       # only sacrifices Maia itself considers natural
  candidates: 30       # look at Maia's 30 most natural moves for sacrifices
  count_offers: true   # also pieces left en prise (chess.com counts those as brilliant too)
  prefer_within_cp: 50 # prefer sacrifices within 0.5 pawns of the best move (that's what chess.com marks brilliant)
  depth: 10           # a bit shallower so checking 30 moves stays fast
  speculative: true    # also Tal's speculative sacrifices: objectively a bit worse, but they create an attack
  spec_min_eval_cp: -80    # a speculative sac stays inside one pawn, not a lost position
  spec_chance: 0.25
  max_cost_cp: 80
  sound_max_cost_cp: 40
  spec_free_cost_cp: 30
  tal_motifs: true     # speculative sacrifices also allowed when they are a favourite motif
  motifs_file: tal/brilliant-motifs.json  # Tal + 21 attacking players (Morphy, Keres, Nezhmetdinov, Spielmann, ...)
  max_eval_cp: 1500    # brilliants also when already winning (chess.com marks those too)
  min_now_cp: -400     # also sacrifice for counterplay when worse (Tal's practical chances)

virtual_clock:         # unlimited / correspondence games: play as if it were rapid 10+0
  enabled: true
  minutes: 10
  increment: 0


human_touches:         # v6
  enabled: true
  sacrifice_think: [8, 20]  # "Tal sits, then sacrifices": 8-20 s before a sacrifice (max 8% of the clock)
  max_clock_share: 0.08
  blitz_out_if_opp_below: 30  # opponent under 30 s: move almost instantly
  resign_from_move: 25
  resign_below: 0.03   # resign when Maia gives us under 3%...
  resign_after: 3      # ...three moves in a row
  keep_playing_if_opp_clock_below: 20  # but not if the opponent might flag
  draw_if_below: 0.35  # accept a draw offer when clearly worse
  draw_from_move: 30   # or after move 30 in a dead equal position
  draw_equal_band: 0.06


adapt:                 # v6: reads the opponent from their moves only (never their rating)
  enabled: true
  window: 8            # last 8 opponent moves
  min_moves: 3
  shaky_above: 0.05    # their moves lose 5%+ winning chances on average (Maia's judgement): shaky
  precise_below: 0.015 # under 1.5%: very precise
  low_clock_seconds: 60  # opponent under 1 minute: treat as shaky (make it messy)
  shaky:               # against a shaky opponent: go for the throat, but not every single time
    tal_rules2:
      tal_traits_boost: 2.6
      complicate_when_worse: {below_cp: 80}
    brilliant:
      spec_chance: 0.40
  precise:             # against a precise opponent: still Tal, just don't donate
    tal_rules2:
      tal_traits_boost: 1.6
    brilliant:
      spec_chance: 0.15


guard:                 # Stockfish blunder guard. Maia still chooses every move.
  enabled: true        # true = ON, false = OFF (applies mid-game within ~30 s)
  playable_cp: -150    # only check moves when the position is at least this good for the bot
  lost_cp: -200        # veto a move that leaves him clearly worse (-2), not only a lost game
  min_drop_cp: 180     # a two-pawn blunder is blocked; a pawn for an attack still gets through
  winning_cp: 150
  winning_floor_cp: 0  # a won position may become equal for the attack, not lost
  depth: 14            # Stockfish search depth for the check
  replace_with: softer_mistake  # softer_mistake = play a smaller mistake instead; maia_next = Maia's next safe move
  softer_drop_cp: 300  # the smaller mistake aims ~3 pawns below the position before...
  softer_target_cp: 0  # ...but at most "equal" (0), so a winning position becomes about equal
  min_clock_seconds: 15  # skip the check when the bot's clock is lower than this
  late:                # from move 30: looser, like a human grandmaster who sometimes spoils a won game
    start_move: 30
    winning_floor_cp: -40
    lost_cp: -250
    min_drop_cp: 220

challenges:
  variants: [standard]
  min_base_seconds: 180   # 3+0 minimum
  max_base_seconds: 900   # 15 min maximum
  max_increment: 10
  accept_unlimited: true  # games without a clock
  accept_rated: true
  accept_casual: true
  accept_humans: true
  accept_bots: false     # only humans who challenge it
  max_games: 1            # games at the same time

session:
  stop_accepting_minutes_before_end: 20

openings:
  # Attacking repertoire for the Tal profile (open, sharp positions). weight 0 = only as fallback.
  white:
    open_sicilian:   {weight: 100, line: "e2e4 c7c5 g1f3 * d2d4", budget: 700}
    scotch:          {weight: 100, line: "e2e4 e7e5 g1f3 b8c6 d2d4", budget: 400}
    french_nc3:      {weight: 100, line: "e2e4 e7e6 d2d4 d7d5 b1c3", budget: 400}
    caro_advance:    {weight: 100, line: "e2e4 c7c6 d2d4 d7d5 e4e5", budget: 300}
    pirc_150_attack: {weight: 100, line: "e2e4 d7d6 d2d4 g8f6 b1c3 g7g6 c1e3", budget: 200}
    e4_other:        {weight: 0, line: "e2e4", budget: 150}
  black:
    sicilian:        {weight: 100, line: "e2e4 c7c5", budget: 800}
    modern_benoni:   {weight: 100, line: "d2d4 g8f6 c2c4 c7c5 d4d5 e7e6", budget: 500}
    kings_indian:    {weight: 100, line: "d2d4 g8f6 * g7g6 * f8g7 * d7d6", budget: 400}
    kid_vs_c4:       {weight: 100, line: "c2c4 g8f6 * g7g6 * f8g7", budget: 200}
    kid_vs_nf3:      {weight: 100, line: "g1f3 g8f6 * g7g6 * f8g7", budget: 200}
  book:
    enabled: true
    path: book-tal-sharp.json   # attacking repertoire built from 2400+ games (Tal's own book: book-tal.json)

matchmaking:           # when idle, challenge other Lichess bots (to measure the real rating)
  enabled: false
  rated: true
  speed: blitz
  limit: 180           # 3+2
  increment: 2
  min_rating: 1900
  max_rating: 2700
  idle_seconds: 60
  exclude: []
