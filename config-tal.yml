# TAL PROFILE: plays as close to Mikhail Tal as we can measure. Maia-3 Lichess bot settings. Edit on github.com; most changes apply within ~30 s, even mid-session.

maia:
  model: maia3-79m     # (model change needs a restart)
  checkpoint: tal-79m.pt   # Maia-3 79M fine-tuned on Tal's games (downloaded at start)
  elo: 2600            # rating Maia imitates (trained range 600-2600)
  temperature: 0.75    # 0 = always most likely move, 1 = full human randomness
  top_p: 1.0           # only sample from the most likely moves covering this probability
  oppo_elo: 2600       # opponent rating Maia assumes; "opponent" = real rating (plays sloppier vs weak players)

search:                # light human-like calculation with Maia's own judgement (no Stockfish)
  enabled: false
  candidates: 4        # natural moves considered (Maia's most likely)
  depth: 1             # 1 = check the opponent's likely replies; 2 = also our answer (slower)
  widths: [3, 2]       # replies considered at each level
  margin: 0.10         # moves within 10% expected score of the best line stay eligible
  skip_if_prob: 0.9    # don't calculate when one move is obvious
  min_clock_seconds: 30

mcts:                  # real calculation, Leela-style, with Maia only (no Stockfish), kept human
  enabled: false
  max_seconds: 3       # thinking budget on normal moves (part of the human move time, not extra)
  hard_seconds: 7      # budget on hard moves (Maia unsure: top move under 35%)
  hard_below: 0.35
  max_clock_share: 0.04  # never more than 4% of the remaining clock on one move
  max_nodes: 400       # positions looked at, at most
  width: 6             # candidate moves per position (only natural, human moves)
  root_width: 10
  batch: 8             # positions evaluated per network call (faster on CPU)
  fpu_reduction: 0.1
  max_depth: 6         # calculation horizon in plies (3 moves each), like a strong human
  cpuct: 1.5
  sharpness: 0.5       # opponent assumed to answer like a strong human
  margin: 0.15         # keep the natural (style) move unless the calculation shows a clear mistake (15% expected score)
  min_prior: 0.04      # only moves Maia gives 4%+ (or its top 3) can be played: no engine-only moves
  min_visits: 3
  skip_if_prob: 0.85   # don't calculate obvious moves
  min_clock_seconds: 45

style:                 # consistent playing style (one "person" across games)
  enabled: true
  name: tal_learned  # Tal-style rules with weights fitted on Tal's games
  rules_file: tal/tal-rules.json
  strength: 2.0        # 0 = pure Maia, 1 = noticeable, 2+ = very consistent / predictable
  candidates: 12       # Maia's moves the Tal rules choose between
  min_relative_prob: 0.25 # rules may pick moves at least a quarter as likely as Maia's top choice

timing:                # human-like thinking time, based only on the move (not on the clock)
  enabled: true
  speed: 1.0           # multiplies all times: 1.5 = slower, 0.7 = faster
  book: [0.2, 0.8]     # seconds (min, max) for prepared opening moves
  forced: [0.1, 0.5]   # only one legal move, or one move Maia is 95%+ sure about
  obvious: [0.2, 1.0]  # recaptures and moves Maia is 80%+ sure about
  follow_up: [0.3, 1.2]  # moving the same piece again right after moving it
  normal: [1.0, 4.0]
  hard_quick: [0.8, 2.5]   # hard moves are inconsistent: sometimes decided quickly...
  hard: [3.0, 9.0]         # ...usually a few seconds...
  long_think: [10.0, 25.0] # ...sometimes a long think
  hard_quick_chance: 0.35
  long_think_chance: 0.2
  # safety net: under 30 s on the clock it plays fast so it never loses on time

assist:                # quality filter: only between Maia's own natural candidate moves
  enabled: false         # stops clearly worse choices when a natural alternative is much better
  only_when_not_top: false # also checks Maia's own first choice (with more freedom, below)
  max_loss_cp: 200     # only replace moves that are 2+ pawns worse than a natural alternative (real blunders)
  top_max_loss_cp: 300 # Maia's own first choice: only if 3+ pawns worse
  min_prob: 0.02       # candidates Maia gives at least 2% are considered (finds more sacrifices)
  depth: 12            # the replacement is picked at random among the OK candidates, weighted by Maia
  brilliant_chance: 0.85   # if a natural candidate sacrifices material and Stockfish rates it (nearly) best, play it this often
  brilliant_margin_cp: 40  # "nearly best" = at most 0.4 pawns below the best natural candidate

brilliant:             # Tal mode: always go for sacrifices that keep the position at least equal
  enabled: true
  chance: 1.0          # 1.0 = always, if a sound sacrifice is among the natural moves
  min_eval_cp: -30     # position after the sacrifice must be at least equal (Stockfish, -0.3 or better)
  min_prob: 0.02       # only moves Maia gives 2%+ (a human could find them)
  depth: 12
  speculative: true    # also Tal's speculative sacrifices: objectively a bit worse, but they create an attack
  spec_min_eval_cp: -150   # may cost up to 1.5 pawns by Stockfish's count (never more)
  spec_chance: 0.3     # how often it goes for one when available
  max_eval_cp: 300     # only look for sacrifices while the game is still open (not when already +3)
  min_now_cp: -200

guard:                 # Stockfish blunder guard. Maia still chooses every move.
  enabled: true        # true = ON, false = OFF (applies mid-game within ~30 s)
  playable_cp: -150    # only check moves when the position is at least this good for the bot
  lost_cp: -250        # veto a move only if it leaves the bot at this evaluation or worse...
  min_drop_cp: 300     # ...and it costs at least this much
  winning_cp: 150      # when the bot is winning (+1.5 or more)...
  winning_floor_cp: -50  # ...it may drop to about equal, but never into a losing position
  depth: 14            # Stockfish search depth for the check
  replace_with: softer_mistake  # softer_mistake = play a smaller mistake instead; maia_next = Maia's next safe move
  softer_drop_cp: 300  # the smaller mistake aims ~3 pawns below the position before...
  softer_target_cp: 0  # ...but at most "equal" (0), so a winning position becomes about equal
  min_clock_seconds: 15  # skip the check when the bot's clock is lower than this

challenges:
  variants: [standard]
  min_base_seconds: 180   # 3+0 minimum
  max_base_seconds: 900   # 15 min maximum
  max_increment: 10
  accept_unlimited: true  # games without a clock
  accept_rated: true
  accept_casual: true
  accept_humans: true
  accept_bots: false     # only humans who challenge it
  max_games: 1            # games at the same time

session:
  stop_accepting_minutes_before_end: 20

openings:
  # Attacking repertoire for the Tal profile (open, sharp positions). weight 0 = only as fallback.
  white:
    open_sicilian:   {weight: 100, line: "e2e4 c7c5 g1f3 * d2d4", budget: 700}
    scotch:          {weight: 100, line: "e2e4 e7e5 g1f3 b8c6 d2d4", budget: 400}
    french_nc3:      {weight: 100, line: "e2e4 e7e6 d2d4 d7d5 b1c3", budget: 400}
    caro_advance:    {weight: 100, line: "e2e4 c7c6 d2d4 d7d5 e4e5", budget: 300}
    pirc_150_attack: {weight: 100, line: "e2e4 d7d6 d2d4 g8f6 b1c3 g7g6 c1e3", budget: 200}
    e4_other:        {weight: 0, line: "e2e4", budget: 150}
  black:
    sicilian:        {weight: 100, line: "e2e4 c7c5", budget: 800}
    modern_benoni:   {weight: 100, line: "d2d4 g8f6 c2c4 c7c5 d4d5 e7e6", budget: 500}
    kings_indian:    {weight: 100, line: "d2d4 g8f6 * g7g6 * f8g7 * d7d6", budget: 400}
    kid_vs_c4:       {weight: 100, line: "c2c4 g8f6 * g7g6 * f8g7", budget: 200}
    kid_vs_nf3:      {weight: 100, line: "g1f3 g8f6 * g7g6 * f8g7", budget: 200}
  book:
    enabled: true
    path: book-tal-rep.json   # attacking repertoire built from 2400+ games (Tal's own book: book-tal.json)

matchmaking:           # when idle, challenge other Lichess bots (to measure the real rating)
  enabled: false
  rated: true
  speed: blitz
  limit: 180           # 3+2
  increment: 2
  min_rating: 1900
  max_rating: 2700
  idle_seconds: 60
  exclude: []

