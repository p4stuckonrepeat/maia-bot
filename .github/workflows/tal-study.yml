name: "Tal: deep study of his games (overnight)"
on:
  workflow_dispatch:
    inputs:
      train:
        description: "Training positions (spread over 8 machines)"
        default: "20000"
      hold:
        description: "Held-out positions (games the bot never saw)"
        default: "4000"
      depth:
        default: "11"
      save:
        description: "Commit report + rules to the repo"
        default: "true"
      debug:
        description: "Seconds until a stack dump (test runs), empty = off"
        default: ""
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: maia3-79m
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt git+https://github.com/CSSLab/maia3@1e13597c42d4858b7cfd7cfdae01e297263364b2
          maia3-cache --model maia3-79m
      - name: Get Tal model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download tal-model -p tal-79m.pt -D prev
      - name: Study
        env:
          STUDY_MODE: collect
          STUDY_SHARD: ${{ matrix.shard }}
          STUDY_SHARDS: "8"
          STUDY_TRAIN: ${{ inputs.train }}
          STUDY_HOLD: ${{ inputs.hold }}
          STUDY_DEPTH: ${{ inputs.depth }}
          PLAYER: tal
          STUDY_DEBUG: ${{ inputs.debug }}
        run: python -u -m tal.study
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: study-shard-*.jsonl
  report:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt git+https://github.com/CSSLab/maia3@1e13597c42d4858b7cfd7cfdae01e297263364b2
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
      - name: Report
        env:
          STUDY_MODE: report
        run: python -u -m tal.study
      - name: Save to the repo
        if: inputs.save == 'true'
        run: |
          cp tal/study-report.md tal/tal-rules2.json /tmp/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }} && git reset --hard origin/${{ github.ref_name }}
          cp /tmp/study-report.md /tmp/tal-rules2.json tal/
          git add tal/study-report.md tal/tal-rules2.json
          git commit -m "Tal study: report and fitted rules" || echo "no changes"
          git push
