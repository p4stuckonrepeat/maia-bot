name: Analyze games
on:
  workflow_dispatch:
    inputs:
      games:
        description: "How many recent games"
        default: "10"
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: maia3-79m
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt git+https://github.com/CSSLab/maia3@1e13597c42d4858b7cfd7cfdae01e297263364b2
          maia3-cache --model maia3-79m
      - name: Analyze
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          ANALYZE_GAMES: ${{ inputs.games }}
        run: python -u -m tools.analyze
