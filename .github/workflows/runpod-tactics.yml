name: "Tal: tactics training (self-play + RunPod)"
on:
  workflow_dispatch:
    inputs:
      positions:
        description: "Self-play positions per machine (6 machines)"
        default: "3000"
permissions:
  contents: write
concurrency: runpod-tactics
env:
  RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: maia3-79m
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt git+https://github.com/CSSLab/maia3@1e13597c42d4858b7cfd7cfdae01e297263364b2
          maia3-cache --model maia3-79m
      - run: gh release download tal-live-v1 -p tal-79m.pt
      - name: Self-play positions
        env:
          SP_SHARD: ${{ matrix.shard }}
          SP_POSITIONS: ${{ inputs.positions }}
        run: python -u -m tools.selfplay_positions
      - uses: actions/upload-artifact@v4
        with:
          name: selfplay-${{ matrix.shard }}
          path: selfplay-*.jsonl
  train:
    needs: selfplay
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: selfplay-*
          merge-multiple: true
      - name: Merge and upload
        run: |
          cat selfplay-*.jsonl | gzip > tactics.jsonl.gz
          zcat tactics.jsonl.gz | wc -l
          gh release upload tal-runs tactics.jsonl.gz --clobber
      - run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Start GPU
        run: echo "POD=$(python3 tools/runpod.py start tactics PLAN_MODE=tactics)" >> "$GITHUB_ENV"
      - name: Wait
        run: python3 tools/runpod.py wait "$POD" tal-runs tactics-info.json 100
      - name: Shut the GPU down (always)
        if: always()
        run: '[ -n "$POD" ] && python3 tools/runpod.py stop "$POD" || echo "no pod"'
      - name: Result
        run: |
          gh release download tal-runs -p tactics-info.json --clobber
          cat tactics-info.json | tee -a "$GITHUB_STEP_SUMMARY"
