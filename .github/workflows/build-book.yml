name: Build opening book
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Quick test run (tiny book, not saved)"
        type: boolean
        default: false
      auth:
        description: "Send the Lichess token to the explorer"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      openings: ${{ steps.l.outputs.openings }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          python3 -c "import yaml,json;c=yaml.safe_load(open('config.yml'))['openings'];print('openings='+json.dumps([n for s in ('white','black') for n in c[s]]))" >> "$GITHUB_OUTPUT"
  build:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        opening: ${{ fromJson(needs.list.outputs.openings) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          pip install -r requirements.txt
      - name: Build ${{ matrix.opening }}
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          BOOK_BUDGET_SCALE: ${{ inputs.test && '0.01' || '1' }}
          BOOK_AUTH: ${{ inputs.auth && '1' || '0' }}
        run: python -u -m tools.build_book --only ${{ matrix.opening }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.opening }}
          path: part-${{ matrix.opening }}.json
  merge:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - run: pip install -r requirements.txt && python -m tools.build_book --merge parts/*.json
      - name: Save book.json to the repo
        if: ${{ !inputs.test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}
          git add book.json
          git commit -m "Rebuild opening book" || echo "no changes"
          git push
