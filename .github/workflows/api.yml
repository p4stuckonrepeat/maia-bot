name: Analysis API
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How long to keep the API online (max 5.5)"
        default: "3"
      profile:
        description: "Which model answers: normal, tal or hikaru"
        type: choice
        options: [normal, tal, hikaru]
        default: normal
concurrency:
  group: analysis-api
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: maia3-79m
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt flask git+https://github.com/CSSLab/maia3@1e13597c42d4858b7cfd7cfdae01e297263364b2
          maia3-cache --model maia3-79m
          curl -sSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
      - name: Get player model
        if: ${{ inputs.profile != 'normal' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.profile }}-model" -p "${{ inputs.profile }}-79m.pt"
      - name: Start
        env:
          ANALYZE_KEY: ${{ secrets.ANALYZE_KEY }}
          BOT_CONFIG: ${{ inputs.profile == 'normal' && 'config.yml' || format('config-{0}.yml', inputs.profile) }}
        run: |
          if [ ${#ANALYZE_KEY} -lt 16 ]; then echo "::error::Add a secret ANALYZE_KEY (16+ characters)"; exit 1; fi
          python -u -m bot.api > api.log 2>&1 &
          for i in $(seq 120); do
            curl -sf localhost:8000/health | grep -q true && break
            sleep 5
          done
          curl -sf localhost:8000/health | grep -q true || { cat api.log; exit 1; }
          ./cloudflared tunnel --no-autoupdate --url http://localhost:8000 > tunnel.log 2>&1 &
          for i in $(seq 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { cat tunnel.log; exit 1; }
          echo "API URL: $URL/analyze"
          echo "### API online: \`$URL/analyze\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep online
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          SECS=$(python -c "import os; print(int(min(5.5, float(os.environ['HOURS'])) * 3600))")
          timeout "$SECS" tail -f api.log || true
