name: Analysis API (Tal v8)
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How long the API stays up (max 5.5)"
        default: "2"
permissions:
  contents: read
  statuses: write
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: maia3-79m
      - name: Install (no Stockfish)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt git+https://github.com/CSSLab/maia3@1e13597c42d4858b7cfd7cfdae01e297263364b2
          maia3-cache --model maia3-79m
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
      - name: Get Tal model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download tal-model -p tal-79m.pt
      - name: Start API + public tunnel
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          nohup uvicorn bot.api:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:8000/ >/dev/null && break
            sleep 2
          done
          if ! curl -sf localhost:8000/ >/dev/null; then
            echo "API did not start"
            cat api.log
            exit 1
          fi
          nohup ./cloudflared tunnel --url http://localhost:8000 2> tunnel.log &
          until grep -qo 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log; do sleep 1; done
          URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
          echo "=============================================="
          echo "API URL: $URL"
          echo "Test:    $URL/analyze?fen=rnbqkbnr%2Fpppppppp%2F8%2F8%2F8%2F8%2FPPPPPPPP%2FRNBQKBNR%20w%20KQkq%20-%200%201"
          echo "=============================================="
          echo "::notice title=API URL::$URL"
          echo "$URL" > api-url.txt
      - name: Publish URL as a commit status (readable while the run is still going)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=success \
            -f context=api-url -f description="$(cat api-url.txt)" -f target_url="$(cat api-url.txt)"
      - name: Keep running
        run: |
          sleep $(python -c "print(int(min(float('${{ inputs.hours }}'), 5.5) * 3600))")
