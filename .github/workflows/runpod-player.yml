name: "Player style training on RunPod (paid GPU, fast)"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "both = train then imitate | fetch = only download the games and count them (no GPU) | tune = measure temperature + real thinking times | train = fine-tune the model | imitate = learn style rules + own opening book"
        default: "both"
      player:
        description: "Games to train on (same format as Kaggle training)"
        default: "multi:group:Carlsen+chesscom:magnuscarlsen:blitz,rapid+lichess:DrNykterstein:blitz,rapid"
      name:
        description: "Model name (file <name>-79m.pt, release <name>-model)"
        default: "carlsen"
      epochs:
        default: "3"
      minutes:
        description: "Training time on the GPU"
        default: "100"
      train_blocks:
        description: "How many top blocks to train (2 = gentle, 8 = more of the network)"
        default: "8"
      lr:
        default: "5e-6"
      tune_only:
        description: "tune mode: temperature | human | all"
        default: "human"
      max_minutes:
        description: "Hard limit: the GPU is shut down after this many minutes no matter what"
        default: "150"
permissions:
  contents: write
concurrency: runpod-player
env:
  RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
jobs:
  fetch:
    if: inputs.mode == 'fetch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and count
        run: |
          pip install -q chess requests
          PLAYER="${{ inputs.player }}" python tools/fetch_games.py "${{ inputs.name }}-games.pgn.gz" 2>&1 | tee fetch.log
          zcat "${{ inputs.name }}-games.pgn.gz" | grep -o '^\[Site "[^"]*' | sed 's/.*"//; s#https://lichess.org/.*#lichess#' | sort | uniq -c | sort -rn | head -8 | tee -a fetch.log
          cat fetch.log >> "$GITHUB_STEP_SUMMARY"
  train:
    if: inputs.mode == 'train' || inputs.mode == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Check key
        run: if [ -z "$RUNPOD_API_KEY" ]; then echo "::error::Secret RUNPOD_API_KEY missing"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the games here (chess.com blocks some GPU-cloud IPs)
        run: |
          pip install -q chess requests
          PLAYER="${{ inputs.player }}" python tools/fetch_games.py "${{ inputs.name }}-games.pgn.gz"
          gh release upload tal-runs "${{ inputs.name }}-games.pgn.gz" --clobber
      - run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Start GPU
        run: |
          echo "POD=$(python3 tools/runpod.py start ${{ inputs.name }} PLAN_MODE=player PLAYER_NAME=${{ inputs.name }} GAMES_ASSET=${{ inputs.name }}-games.pgn.gz \
            "PLAYER=${{ inputs.player }}" TAL_EPOCHS=${{ inputs.epochs }} TAL_MINUTES=${{ inputs.minutes }} \
            TAL_TRAIN_BLOCKS=${{ inputs.train_blocks }} TAL_LR=${{ inputs.lr }})" >> "$GITHUB_ENV"
      - name: Wait
        run: python3 tools/runpod.py wait "$POD" tal-runs ${{ inputs.name }}-info.json ${{ inputs.max_minutes }}
      - name: Shut the GPU down (always)
        if: always()
        run: '[ -n "$POD" ] && python3 tools/runpod.py stop "$POD" || echo "no pod"'
      - name: Results and save (only if better than normal Maia)
        run: |
          N="${{ inputs.name }}"
          gh release download tal-runs -p "$N-info.json" --clobber
          cat "$N-info.json"
          python3 - "$N" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          i = json.load(open(f"{sys.argv[1]}-info.json"))
          if "error" in i:
              print(f"## Training failed\n```\n{i['error'][-1500:]}\n```"); sys.exit(0)
          print(f"## Style training: {i.get('player')} on {i.get('gpu')}\n- games {i['games']}, trained moves {i['train_moves']}, "
                f"epochs {i['epochs']:.2f}, {i['positions_per_s']:.0f} positions/s\n"
                f"- predicts the player's move on held-out games: **{i['before']:.1%} -> {i['after']:.1%}**")
          PY
          cat "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys; i=json.load(open('$N-info.json')); sys.exit(0 if i.get('improved') else 1)" || { echo "Not better than normal Maia - not saved"; exit 0; }
          gh release download tal-runs -p "$N-79m.pt" --clobber
          TAG="$N-model"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$N style model" --notes "Maia-3 79M fine-tuned on ${{ inputs.player }}"
          gh release upload "$TAG" "$N-79m.pt" "$N-info.json" --clobber
  imitate:
    needs: train
    if: always() && (inputs.mode == 'imitate' || (inputs.mode == 'both' && needs.train.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check key
        run: if [ -z "$RUNPOD_API_KEY" ]; then echo "::error::Secret RUNPOD_API_KEY missing"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the games here (chess.com blocks some GPU-cloud IPs)
        run: |
          pip install -q chess requests
          PLAYER="${{ inputs.player }}" python tools/fetch_games.py "${{ inputs.name }}-games.pgn.gz"
          gh release upload tal-runs "${{ inputs.name }}-games.pgn.gz" --clobber
      - run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Start GPU
        run: |
          echo "POD=$(python3 tools/runpod.py start ${{ inputs.name }}-imitate PLAN_MODE=imitate PLAYER_NAME=${{ inputs.name }} GAMES_ASSET=${{ inputs.name }}-games.pgn.gz \
            "PLAYER=${{ inputs.player }}" IMIT_TRAIN_POSITIONS=6000 IMIT_EVAL_POSITIONS=2500 PLAYER_MAX_GAMES=0)" >> "$GITHUB_ENV"
      - name: Wait
        run: python3 tools/runpod.py wait "$POD" tal-runs ${{ inputs.name }}-imitate.json ${{ inputs.max_minutes }}
      - name: Shut the GPU down (always)
        if: always()
        run: '[ -n "$POD" ] && python3 tools/runpod.py stop "$POD" || echo "no pod"'
      - name: Results and save rules + book to the branch
        run: |
          N="${{ inputs.name }}"
          gh release download tal-runs -p "$N-imitate.json" -p "$N-imitate.log" --clobber
          grep -E "chess.com|lichess |games:|group|exact player moves|rules|book" "$N-imitate.log" | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys; i=json.load(open('$N-imitate.json')); print(i.get('summary','')); sys.exit('failed: '+i['error'] if 'error' in i else 0)" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release download tal-runs -p "$N-rules.json" -p "book-$N.json" -D /tmp --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }} && git reset --hard origin/${{ github.ref_name }}
          cp /tmp/$N-rules.json tal/ && cp /tmp/book-$N.json .
          git add tal/$N-rules.json book-$N.json
          git commit -m "$N: learned rules and opening book (RunPod)" || echo "no changes"
          git push
  tune:
    if: inputs.mode == 'tune'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check key
        run: if [ -z "$RUNPOD_API_KEY" ]; then echo "::error::Secret RUNPOD_API_KEY missing"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the games here (chess.com blocks some GPU-cloud IPs)
        run: |
          pip install -q chess requests
          PLAYER="${{ inputs.player }}" python tools/fetch_games.py "${{ inputs.name }}-games.pgn.gz"
          gh release upload tal-runs "${{ inputs.name }}-games.pgn.gz" --clobber
      - run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Start GPU
        run: |
          echo "POD=$(python3 tools/runpod.py start ${{ inputs.name }}-tune PLAN_MODE=tune TUNE_ONLY=${{ inputs.tune_only }} PLAYER_NAME=${{ inputs.name }} GAMES_ASSET=${{ inputs.name }}-games.pgn.gz \
            "PLAYER=${{ inputs.player }}" PLAYER_MAX_GAMES=0)" >> "$GITHUB_ENV"
      - name: Wait
        run: python3 tools/runpod.py wait "$POD" tal-runs ${{ inputs.name }}-tune.json ${{ inputs.max_minutes }}
      - name: Shut the GPU down (always)
        if: always()
        run: '[ -n "$POD" ] && python3 tools/runpod.py stop "$POD" || echo "no pod"'
      - name: Results
        run: |
          gh release download tal-runs -p "${{ inputs.name }}-tune.json" --clobber
          cat "${{ inputs.name }}-tune.json" | tee -a "$GITHUB_STEP_SUMMARY"
