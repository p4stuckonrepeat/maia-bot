name: Run bot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "play = go online on Lichess, check = test only"
        type: choice
        options: [play, check]
        default: play
      hours:
        description: "Session length in hours (max 5.5)"
        default: "5"
      profile:
        description: "normal = Maia + book + rules, tal = play like Mikhail Tal"
        type: choice
        options: [normal, tal, hikaru, carlsen, magnus-v2, carlsen-elite]
        default: normal
concurrency:
  group: lichess-bot-${{ inputs.mode }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: maia3-79m
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt git+https://github.com/CSSLab/maia3@1e13597c42d4858b7cfd7cfdae01e297263364b2
          maia3-cache --model maia3-79m
      - name: Get player model
        if: ${{ inputs.profile != 'normal' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          M="${{ inputs.profile }}"; [ "$M" = "magnus-v2" ] && M=carlsen   # magnus-v2 uses the Carlsen model
          gh release download "$M-model" -p "$M-79m.pt"
      - name: Self-test (offline)
        timeout-minutes: 5
        run: python -u -m tests.selftest
      - name: Bot
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          BOT_CONFIG: ${{ inputs.profile == 'normal' && 'config.yml' || format('config-{0}.yml', inputs.profile) }}
        run: |
          if [ -z "$LICHESS_TOKEN" ]; then echo "::error::Secret LICHESS_TOKEN is missing"; exit 1; fi
          if [ "${{ inputs.mode }}" = "check" ]; then
            python -m bot.main --check
          else
            python -m bot.main --hours "${{ inputs.hours }}"
          fi
