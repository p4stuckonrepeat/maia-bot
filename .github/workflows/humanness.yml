name: Human-likeness test
on:
  workflow_dispatch:
    inputs:
      positions:
        description: "Number of test positions"
        default: "500"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: maia3-79m
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt git+https://github.com/CSSLab/maia3@1e13597c42d4858b7cfd7cfdae01e297263364b2
          maia3-cache --model maia3-79m
      - name: Test
        env:
          HUMAN_POSITIONS: ${{ inputs.positions }}
        run: python -u -m tools.humanness
